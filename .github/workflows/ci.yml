name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build APO and app
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Run tests
        shell: pwsh
        run: |
          dotnet build tests/Soundboard.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Soundboard.Tests.csproj -c Release --no-build
          exit $LASTEXITCODE
